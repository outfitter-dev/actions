name: Belay Stack CI
on:
  workflow_call:
    inputs:
      use_graphite:
        description: 'Use Graphite CI Optimizer (true|false|auto)'
        type: string
        default: 'auto'
    secrets:
      GRAPHITE_CI_OPTIMIZER_TOKEN:
        required: false
      CI_STICKY_COMMENTS:
        required: false
      CI_STATUS_WEBHOOK:
        required: false

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.det.outputs.provider }}
      position: ${{ steps.det.outputs.position }}
      tier: ${{ steps.det.outputs.tier }}
      is_agent: ${{ steps.det.outputs.is_agent }}
      install_cmd: ${{ steps.det.outputs.install_cmd }}
      lint_cmd: ${{ steps.det.outputs.lint_cmd }}
      typecheck_cmd: ${{ steps.det.outputs.typecheck_cmd }}
      test_cmd: ${{ steps.det.outputs.test_cmd }}
      build_cmd: ${{ steps.det.outputs.build_cmd }}
      lang: ${{ steps.det.outputs.lang }}
      critical: ${{ steps.det.outputs.critical }}
      cache_key: ${{ steps.det.outputs.cache_key }}
      cache_path: ${{ steps.det.outputs.cache_path }}
      workspaces: ${{ steps.det.outputs.workspaces }}
      is_monorepo: ${{ steps.det.outputs.is_monorepo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: det
        uses: outfitter-dev/actions/actions/detector@main
        with:
          use_graphite: ${{ inputs.use_graphite }}
        env:
          GRAPHITE_TOKEN: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  meta:
    name: CI Status
    runs-on: ubuntu-latest
    needs: detect
    if: always()
    outputs:
      summary: ${{ steps.sum.outputs.summary }}
    steps:
      - id: sum
        run: |
          SUMMARY="provider:${{ needs.detect.outputs.provider }} pos:${{ needs.detect.outputs.position }} tier:${{ needs.detect.outputs.tier }} critical:${{ needs.detect.outputs.critical }} agent:${{ needs.detect.outputs.is_agent }}"
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 Belay CI Status

          | Property | Value |
          |----------|-------|
          | **Provider** | ${{ needs.detect.outputs.provider }} |
          | **Position** | ${{ needs.detect.outputs.position }} |
          | **Tier** | ${{ needs.detect.outputs.tier }} |
          | **Language** | ${{ needs.detect.outputs.lang }} |
          | **Monorepo** | ${{ needs.detect.outputs.is_monorepo }} |
          | **Critical** | ${{ needs.detect.outputs.critical }} |
          | **Agent** | ${{ needs.detect.outputs.is_agent }} |
          EOF

      - name: Post PR Comment
        if: |
          github.event_name == 'pull_request' && 
          (secrets.CI_STICKY_COMMENTS == 'true' || contains(github.event.pull_request.body, '[belay-comment]'))
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: belay-ci
          message: |
            ## 🚀 Belay CI
            
            - **Provider**: ${{ needs.detect.outputs.provider }}
            - **Position**: ${{ needs.detect.outputs.position }}
            - **Tier**: ${{ needs.detect.outputs.tier }}
            - **Language**: ${{ needs.detect.outputs.lang }}
            - **Critical**: ${{ needs.detect.outputs.critical }}

      - name: Send Webhook
        if: secrets.CI_STATUS_WEBHOOK != ''
        run: |
          curl -fsSL -H 'Content-Type: application/json' \
            -d '{
              "repo": "${{ github.repository }}",
              "pr": ${{ github.event.pull_request.number || 0 }},
              "sha": "${{ github.sha }}",
              "provider": "${{ needs.detect.outputs.provider }}",
              "position": "${{ needs.detect.outputs.position }}",
              "ci_mode": "${{ needs.detect.outputs.tier }}",
              "critical_escalation": ${{ needs.detect.outputs.critical == 'true' }},
              "merge_queue_event": ${{ github.event_name == 'merge_group' }},
              "is_monorepo": ${{ needs.detect.outputs.is_monorepo == 'true' }}
            }' \
            "${{ secrets.CI_STATUS_WEBHOOK }}" || true

  minimal:
    name: Minimal
    needs: [detect, meta]
    if: |
      needs.detect.outputs.tier == 'minimal' || 
      needs.detect.outputs.tier == 'essential' || 
      needs.detect.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Language setup
      - uses: oven-sh/setup-bun@v2
        if: needs.detect.outputs.lang == 'bun'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: needs.detect.outputs.lang == 'node'
        with:
          node-version: 'lts/*'

      - uses: actions/setup-go@v5
        if: needs.detect.outputs.lang == 'go'
        with:
          go-version: 'stable'

      - uses: dtolnay/rust-toolchain@stable
        if: needs.detect.outputs.lang == 'rust'

      - uses: actions/setup-python@v5
        if: needs.detect.outputs.lang == 'python'
        with:
          python-version: '3.x'

      # Caching
      - name: Cache Dependencies
        if: needs.detect.outputs.cache_key != ''
        uses: actions/cache@v4
        with:
          path: ${{ needs.detect.outputs.cache_path }}
          key: ${{ needs.detect.outputs.cache_key }}
          restore-keys: |
            ${{ runner.os }}-${{ needs.detect.outputs.lang }}-

      - name: Install Dependencies
        if: needs.detect.outputs.install_cmd != ''
        run: ${{ needs.detect.outputs.install_cmd }}

      - name: Lint
        if: needs.detect.outputs.lint_cmd != ''
        run: ${{ needs.detect.outputs.lint_cmd }}
        continue-on-error: ${{ needs.detect.outputs.is_agent == 'true' }}

      - name: Type Check
        if: needs.detect.outputs.typecheck_cmd != ''
        run: ${{ needs.detect.outputs.typecheck_cmd }}

  essential:
    name: Essential
    needs: [detect, meta, minimal]
    if: |
      needs.detect.outputs.tier == 'essential' || 
      needs.detect.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Language setup (same as minimal)
      - uses: oven-sh/setup-bun@v2
        if: needs.detect.outputs.lang == 'bun'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: needs.detect.outputs.lang == 'node'
        with:
          node-version: 'lts/*'

      - uses: actions/setup-go@v5
        if: needs.detect.outputs.lang == 'go'
        with:
          go-version: 'stable'

      - uses: dtolnay/rust-toolchain@stable
        if: needs.detect.outputs.lang == 'rust'

      - uses: actions/setup-python@v5
        if: needs.detect.outputs.lang == 'python'
        with:
          python-version: '3.x'

      # Caching
      - name: Cache Dependencies
        if: needs.detect.outputs.cache_key != ''
        uses: actions/cache@v4
        with:
          path: ${{ needs.detect.outputs.cache_path }}
          key: ${{ needs.detect.outputs.cache_key }}

      - name: Install Dependencies
        if: needs.detect.outputs.install_cmd != ''
        run: ${{ needs.detect.outputs.install_cmd }}

      - name: Build
        if: needs.detect.outputs.build_cmd != ''
        run: ${{ needs.detect.outputs.build_cmd }}

      - name: Test (with retry)
        if: needs.detect.outputs.test_cmd != ''
        run: |
          if [ -f scripts/with-retry.sh ]; then
            ./scripts/with-retry.sh "${{ needs.detect.outputs.test_cmd }}"
          else
            ${{ needs.detect.outputs.test_cmd }} || ${{ needs.detect.outputs.test_cmd }}
          fi

  full:
    name: Full
    needs: [detect, meta, minimal]
    if: needs.detect.outputs.tier == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Language setup
      - uses: oven-sh/setup-bun@v2
        if: needs.detect.outputs.lang == 'bun'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: needs.detect.outputs.lang == 'node'
        with:
          node-version: 'lts/*'

      - uses: actions/setup-go@v5
        if: needs.detect.outputs.lang == 'go'
        with:
          go-version: 'stable'

      - uses: dtolnay/rust-toolchain@stable
        if: needs.detect.outputs.lang == 'rust'

      - uses: actions/setup-python@v5
        if: needs.detect.outputs.lang == 'python'
        with:
          python-version: '3.x'

      # Caching
      - name: Cache Dependencies
        if: needs.detect.outputs.cache_key != ''
        uses: actions/cache@v4
        with:
          path: ${{ needs.detect.outputs.cache_path }}
          key: ${{ needs.detect.outputs.cache_key }}

      - name: Install Dependencies
        if: needs.detect.outputs.install_cmd != ''
        run: ${{ needs.detect.outputs.install_cmd }}

      - name: Lint
        if: needs.detect.outputs.lint_cmd != ''
        run: ${{ needs.detect.outputs.lint_cmd }}

      - name: Type Check
        if: needs.detect.outputs.typecheck_cmd != ''
        run: ${{ needs.detect.outputs.typecheck_cmd }}

      - name: Build
        if: needs.detect.outputs.build_cmd != ''
        run: ${{ needs.detect.outputs.build_cmd }}

      - name: Test (comprehensive)
        if: needs.detect.outputs.test_cmd != ''
        run: |
          if [ -f scripts/with-retry.sh ]; then
            ./scripts/with-retry.sh "${{ needs.detect.outputs.test_cmd }}"
          else
            ${{ needs.detect.outputs.test_cmd }}
          fi

      - name: Coverage Report
        if: contains(needs.detect.outputs.test_cmd, 'coverage') || contains(needs.detect.outputs.test_cmd, '--coverage')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage/
            .coverage/
            htmlcov/

  # Required status check that never skips
  status:
    name: CI
    runs-on: ubuntu-latest
    needs: [detect, meta, minimal, essential, full]
    if: always()
    steps:
      - name: Check Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ CI Failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ CI Cancelled"
            exit 1
          else
            echo "✅ CI Passed"
          fi